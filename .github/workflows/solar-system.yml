name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
    

env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD}}
    DOCKERHUB_USERNAME: ${{vars.DOCKERHUB_USERNAME}}
jobs:
    unit-testing:
        name: Unit Testing
        # services:
        #   mongo-db:
        #     image: siddharth67/mongo-db:non-prod
        #     ports:
        #       - 27017:27017

        # env:
        #   MONGO_URI: 'mongodb://localhost:27017/superData'
        #   MONGO_USERNAME: non-prod-user
        #   MONGO_PASSWORD: non-prod-password
   

        strategy:
          matrix:
            os: [ ubuntu-latest]
            version: [18,  20]
            exclude:
              - version: 18
                os: macos-latest

        runs-on: ${{ matrix.os }}
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS ${{ matrix.version }}
          uses: actions/setup-node@v3
          with:
            node-version: ${{ matrix.version }}

        - name: Cache NPM Dependencies
          uses: actions/cache@v4
          with:
            path: node_modules
            key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
       

    
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          id: node-testing-on-machines
          run: npm test


        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result-${{ matrix.os }}-node-${{ matrix.version }}
            path: test-results.xml
    
    code-coverage:
        name: Code Coverage
        container: 
          image: node:18

        # services:
        #   mongo-db:
        #     image: siddharth67/mongo-db:non-prod
        #     options: 
        #       --name mongo
        #     # no need for port mapping if service container is working with a job container

        # env:
        #   MONGO_URI: 'mongodb://mongo:27017/superData'
        #   MONGO_USERNAME: non-prod-user
        #   MONGO_PASSWORD: non-prod-password


        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS 
          uses: actions/setup-node@v3
          with:
            node-version: 18
    
        - name: Cache NPM Dependencies
          uses: actions/cache@v4
          with:
            path: node_modules
            key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

        - name: Install Dependencies
          run: npm install

        - name: Print new context
          run : echo ${{ github.actor_id }}
    
        - name: Check code coverage
          continue-on-error: true
          run: npm run coverage

        - name: Archive Test Result
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result
            path: coverage
            retention-days: 5

    docker:
      runs-on: ubuntu-latest
      permissions: 
        packages: write
      needs: [ unit-testing, code-coverage]
      steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

        

      - name: Docker build for testing
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

      - name: Docker Image Test
        run: |
            docker images
            docker run --name solar-system-app -d \
            -p 3000:3000 \
            -e MONGO_URI=$MONGO_URI \
            -e MONGO_USERNAME=$MONGO_USERNAME \
            -e MONGO_PASSWORD=$MONGO_PASSWORD \
            ${{ env.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

            export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app )
            echo $IP

            echo Testing Image Url using wget
            wget -q -O - http://127.0.0.1:3000/live | grep live

      

      
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to Github packages
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
    
    dev-deploy:
      needs: docker
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Install Kubectl CLI
          uses: azure/setup-kubectl@v3
          with:
            version: 'v1.26.0'

        - name: Set KubeConfig
          uses: azure/k8s-set-context@v4
          with:
            method: kubeconfig
            kubeconfig: ${{ secrets.KUBECONFIG }}
            
        
        - name: Fetch Kubernetes Cluster Details
          run: |
            kubectl version --short
            echo -----------------------------------------
            kubectl get nodes



